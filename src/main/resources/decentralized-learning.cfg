# Fully decentralized PeerSim learning scenario.

sim.engine = peersim.cdsim.CDSimulator
simulation.cycles = 60
network.size = 8

# Protocol order matters in CD simulations:
# 0 = Chord overlay, 1 = local learner, 2 = parameter DHT, 3 = gossip, 4 = convergence tracker
protocol.0 = com.example.peersimdjl.ChordProtocol
protocol.1 = com.example.peersimdjl.LearningProtocol
protocol.2 = com.example.peersimdjl.ParameterDHTProtocol
protocol.3 = com.example.peersimdjl.GossipProtocol
protocol.4 = com.example.peersimdjl.ConvergenceProtocol

# Chord overlay initialization
control.init = com.example.peersimdjl.InitControl
control.init.pids = 0

# Learning protocol configuration
protocol.1.dhtPid = 2
protocol.1.convergencePid = 4
protocol.1.selfPid = 1
protocol.1.parameterCount = 8
protocol.1.batchSize = 16
protocol.1.learningRate = 0.05
protocol.1.epsilon = 0.001

# Parameter DHT protocol configuration
protocol.2.chordPid = 0
protocol.2.selfPid = 2
protocol.2.parameterCount = 8
protocol.2.initialValueScale = 0.01

# Gossip protocol configuration
protocol.3.convergencePid = 4
protocol.3.selfPid = 3
protocol.3.fanout = 3
protocol.3.retryRounds = 6
protocol.3.dropProbability = 0.05

# Convergence protocol configuration
protocol.4.gossipPid = 3
protocol.4.convergenceEpsilon = 0.001
protocol.4.requiredConvergedRatio = 0.8
protocol.4.requiredStableRounds = 3